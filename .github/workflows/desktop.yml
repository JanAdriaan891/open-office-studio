name: Kantooromgeving controleren en bouwen
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux-bouwafhankelijkheden
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: python -m unittest discover -s tests -v
      - run: node scripts/test-kantoor-engines.mjs
      - name: Windows-loader voorbereiden
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/voorbereiden-windows.ps1
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Linux-pakket bouwen
        if: runner.os == 'Linux'
        run: pnpm desktop:build --bundles deb,appimage
      - name: Windows-pakket bouwen
        if: runner.os == 'Windows'
        run: pnpm desktop:build --bundles nsis
      - name: macOS-pakket bouwen
        if: runner.os == 'macOS'
        run: pnpm desktop:build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: open-office-studio-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
